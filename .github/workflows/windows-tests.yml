name: Windows regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare local build prerequisites
        run: python -m pip install --upgrade "setuptools>=70.1" "tomli>=2; python_version < '3.11'"
      - name: Run offline regression and installation checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-artifacts | Out-Null
          python -B -m unittest discover -s tests -v *> ci-artifacts/tests.log
          $testExit = $LASTEXITCODE
          Get-Content -LiteralPath ci-artifacts/tests.log -Tail 80
          exit $testExit
      - name: Check command-line entries
        shell: pwsh
        run: |
          python -B collect_architecture.py --dry-run --limit 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B process_architecture.py --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B desktop_app.py --help
          exit $LASTEXITCODE
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-python-${{ matrix.python-version }}-tests
          path: ci-artifacts/tests.log
          if-no-files-found: ignore
